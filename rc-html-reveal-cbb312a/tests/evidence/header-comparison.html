<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Comparación del bloque superior · MASTER vs HTML</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 24px; background: #173b2b; font-family: Arial, sans-serif; }
      main { display: grid; grid-template-columns: repeat(2, 390px); gap: 24px; width: max-content; }
      figure { margin: 0; overflow: hidden; border-radius: 12px; background: #faf4e4; box-shadow: 0 12px 30px rgb(0 0 0 / 24%); }
      figcaption { height: 42px; padding: 13px 16px; background: #0d3225; color: #d6ad54; font-size: 13px; letter-spacing: .12em; text-align: center; }
      .crop { width: 390px; height: 280px; overflow: hidden; background: #faf4e4; }
      .crop img { display: block; width: 390px; height: auto; }
      .html iframe { display: block; width: 390px; height: 280px; border: 0; background: #faf4e4; pointer-events: none; }
      @media (max-width: 900px) {
        body { padding: 18px; }
        main { grid-template-columns: 390px; }
      }
    </style>
  </head>
  <body>
    <main>
      <figure>
        <figcaption>MASTER_MENU_v1.0</figcaption>
        <div class="crop"><img src="../../img/menu/MASTER_MENU_v1.0.png" alt="Cabecera del menú master"></div>
      </figure>
      <figure>
        <figcaption>HTML · BLOQUE SUPERIOR DEFINITIVO</figcaption>
        <div class="crop html"><iframe src="../../index.html" title="Bloque superior HTML definitivo" scrolling="no" onload="this.contentDocument.getElementById('menu-photo-viewer').style.display='none'"></iframe></div>
      </figure>
    </main>
  </body>
</html>
